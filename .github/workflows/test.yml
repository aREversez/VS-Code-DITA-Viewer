name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      # VS Code integration tests need a display server on Linux;
      # @vscode/test-electron 3.x requires Node >= 22
      - name: E2E tests (Linux)
        if: runner.os == 'Linux' && matrix.node == 22
        run: xvfb-run -a npm run test:e2e
      - name: E2E tests (Windows/macOS)
        if: runner.os != 'Linux' && matrix.node == 22
        run: npm run test:e2e
