name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # esbuild reads tsconfig.json for compiler options but strips types without
      # checking them, and the tsc invocations in pretest and test:e2e use narrower
      # include lists that omit the webview providers -- so this is the only step
      # that typechecks all of src/
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      # l10n consistency guard (source strings vs l10n/package.nls catalogs);
      # a pure source scan, so it needs neither a build nor a display server
      - run: npm run check:l10n
      # VS Code integration tests need a display server on Linux;
      # @vscode/test-electron 3.x requires Node >= 22
      - name: E2E tests (Linux)
        if: runner.os == 'Linux' && matrix.node == 22
        run: xvfb-run -a npm run test:e2e
      - name: E2E tests (Windows/macOS)
        if: runner.os != 'Linux' && matrix.node == 22
        run: npm run test:e2e

  # Packaging gate: build the .vsix and assert its contents. .vscodeignore is
  # the only thing deciding what ships, and a slip (a shipped template tree
  # missing, or a src/ or test-dita-file/ leak) is otherwise invisible until a
  # user installs the extension -- CI never opened the archive before.
  package:
    name: Package (vsix contents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `npx --yes @vscode/vsce` fetches vsce on demand (it is not a devDependency,
      # keeping the zero-runtime-dependency footprint); package --no-dependencies
      # mirrors what a real publish would ship.
      - run: npm run check:package

  # Real-browser check for the site/book template feature: loads the same
  # template snapshot HTML the preview builds into headless Chromium and asserts
  # computed-style/structural invariants (a template must not break the
  # content-visibility rule; headers/footers must have height; light vs dark
  # palettes must differ). Not part of `npm test` -- it needs a Chromium download
  # and is slower -- so it runs here, its own job. Not a pixel-diff (no committed
  # baselines), so it is deterministic: two consecutive local runs passed clean
  # (~15s, ~8s), hence blocking rather than continue-on-error.
  visual:
    name: Visual (Playwright Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache the browser directory keyed on the lockfile (pins the Playwright
      # version); install then becomes a no-op download on a cache hit. The
      # test itself needs no VS Code or build -- tsconfig.visual compiles the
      # pure template modules straight into dist-test-visual.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
