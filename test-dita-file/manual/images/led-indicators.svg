<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240">
  <rect x="0" y="0" width="680" height="240" fill="#f8fafc"/>
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <circle cx="115" cy="90" r="42" fill="none" stroke="#e2e8f0" stroke-width="10"/>
    <circle cx="115" cy="90" r="42" fill="none" stroke="#ffffff" stroke-width="10" stroke-dasharray="264" stroke-dashoffset="0"/>
    <text x="115" y="165" fill="#334155" font-weight="bold">白色常亮</text>
    <text x="115" y="188" fill="#64748b">正常运行</text>

    <circle cx="285" cy="90" r="42" fill="none" stroke="#22d3ee" stroke-width="10" stroke-dasharray="60 40"/>
    <text x="285" y="165" fill="#334155" font-weight="bold">青色渐变</text>
    <text x="285" y="188" fill="#64748b">语音交互中</text>

    <circle cx="455" cy="90" r="42" fill="none" stroke="#facc15" stroke-width="10" stroke-dasharray="24 60"/>
    <text x="455" y="165" fill="#334155" font-weight="bold">黄色慢闪</text>
    <text x="455" y="188" fill="#64748b">网络已断开</text>

    <circle cx="625" cy="90" r="42" fill="none" stroke="#ef4444" stroke-width="10" stroke-dasharray="132 132"/>
    <text x="625" y="165" fill="#334155" font-weight="bold">红色常亮</text>
    <text x="625" y="188" fill="#64748b">系统异常</text>
  </g>
  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#0f172a" font-weight="bold">环形氛围灯常见状态（详见正文状态表）</text>
</svg>
